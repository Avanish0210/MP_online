<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Heart Disease Prediction</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f5f7fb; color: #172033; margin: 0; }
    main { max-width: 850px; margin: 40px auto; padding: 28px; background: white; border-radius: 12px; box-shadow: 0 4px 20px #17203318; }
    h1 { margin-top: 0; } .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 14px; }
    label { display: grid; gap: 6px; font-weight: 600; font-size: .9rem; } input { padding: 9px; border: 1px solid #c8d1df; border-radius: 6px; }
    button { margin-top: 22px; padding: 11px 18px; background: #1769aa; border: 0; border-radius: 6px; color: white; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 18px; padding: 12px; background: #edf4fb; border-radius: 6px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Heart Disease Prediction</h1>
    <p>Enter clinical parameters to receive a model prediction. This demonstration is not medical advice.</p>
    <form id="prediction-form"><div class="grid">
      {% for feature in features %}<label>{{ feature }}<input name="{{ feature }}" type="number" step="any" required></label>{% endfor %}
    </div><button type="submit">Predict</button></form>
    <div id="result">Enter values and select Predict.</div>
  </main>
  <script>
    document.getElementById('prediction-form').addEventListener('submit', async (event) => {
      event.preventDefault(); const form = new FormData(event.target); const payload = Object.fromEntries([...form].map(([k,v]) => [k, Number(v)]));
      const result = document.getElementById('result'); result.textContent = 'Predicting...';
      try { const response = await fetch('/predict', {method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload)}); result.textContent = JSON.stringify(await response.json(), null, 2); }
      catch (error) { result.textContent = 'Request failed: ' + error.message; }
    });
  </script>
</body>
</html>
